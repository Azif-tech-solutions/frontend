<!doctype html><html><head><meta charset="utf-8"><title>MyBiz — Marketing site</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0}body{background:var(--surface-page)}</style></head>
<body><div id="root"></div>
<script type="text/babel" src="SiteHeader.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="FeatureSection.jsx"></script>
<script type="text/babel" src="PricingSection.jsx"></script>
<script type="text/babel" src="SiteFooter.jsx"></script>
<script type="text/babel">
const { Dialog, Button, Input, Toast } = window.MyBizDesignSystem_c77ec7;
function Site(){
  const [signup,setSignup]=React.useState(false);
  const [toast,setToast]=React.useState(null);
  const fire=m=>{setToast(m);clearTimeout(window.__t);window.__t=setTimeout(()=>setToast(null),2600);};
  return <div style={{position:'relative'}}>
    <SiteHeader onCta={()=>setSignup(true)}/>
    <Hero onCta={()=>setSignup(true)} onPrompt={p=>fire('Building: '+p)}/>
    <FeatureSection/>
    <PricingSection onCta={()=>setSignup(true)}/>
    <SiteFooter onCta={()=>setSignup(true)}/>
    {signup && <div style={{position:'fixed',inset:0,zIndex:60}}>
      <Dialog title="Start your free trial" description="14 days of the Team plan. No credit card required."
        onClose={()=>setSignup(false)}
        footer={<><Button variant="ghost" onClick={()=>setSignup(false)}>Cancel</Button>
        <Button onClick={()=>{setSignup(false);fire('Check your inbox for a magic link');}}>Create workspace</Button></>}>
        <div style={{display:'flex',flexDirection:'column',gap:14}}>
          <Input label="Work email" size="lg" placeholder="you@company.com"/>
          <Input label="Company" size="lg" placeholder="Northwind Labs"/>
        </div></Dialog></div>}
    {toast && <div style={{position:'fixed',left:20,bottom:20,zIndex:70}}><Toast tone="success" onDismiss={()=>setToast(null)}>{toast}</Toast></div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Site/>);
</script></body></html>
