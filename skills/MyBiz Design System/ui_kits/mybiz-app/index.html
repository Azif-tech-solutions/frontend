<!doctype html><html><head><meta charset="utf-8"><title>MyBiz — Workspace app</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body,#root{height:100%;margin:0}body{background:var(--surface-page);overflow:hidden}</style></head>
<body><div id="root"></div>
<script type="text/babel" src="TopBar.jsx"></script>
<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="GridScreen.jsx"></script>
<script type="text/babel" src="AuthScreen.jsx"></script>
<script type="text/babel">
const { Toast } = window.MyBizDesignSystem_c77ec7;
function App(){
  const [signedIn,setSignedIn]=React.useState(false);
  const [route,setRoute]=React.useState('home');
  const [sidebar,setSidebar]=React.useState(true);
  const [toast,setToast]=React.useState(null);
  const fire=m=>{setToast(m);clearTimeout(window.__t);window.__t=setTimeout(()=>setToast(null),2600);};
  if(!signedIn) return <div style={{height:'100%',overflow:'auto'}}><AuthScreen onContinue={()=>setSignedIn(true)}/></div>;
  return <div style={{height:'100%',display:'flex',flexDirection:'column',position:'relative'}}>
    <TopBar onToggleSidebar={()=>setSidebar(s=>!s)}/>
    <div style={{flex:1,minHeight:0,display:'flex'}}>
      {sidebar && <Sidebar route={route} onNavigate={setRoute}/>}
      <div style={{flex:1,minWidth:0,overflow:'auto',background:route==='grid'?'var(--surface-page)':'var(--surface-page)'}}>
        {route==='home'
          ? <HomeScreen onOpenBase={()=>setRoute('grid')} onToast={fire}/>
          : <div style={{height:'100%'}}><GridScreen onToast={fire}/></div>}
      </div>
    </div>
    {toast && <div style={{position:'absolute',left:20,bottom:20,zIndex:60}}><Toast tone="success" onDismiss={()=>setToast(null)}>{toast}</Toast></div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
