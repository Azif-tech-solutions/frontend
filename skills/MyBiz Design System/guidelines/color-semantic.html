<!-- @dsCard group="Colors" viewport="700x150" name="Status" subtitle="success, warning, danger, info — tint for surfaces, solid for icons" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--surface-page);font:var(--type-body);padding:18px 22px}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)}.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font:var(--fw-semibold) 10px/1 var(--font-mono)}.g{display:grid;gap:12px}.t{font:var(--type-eyebrow);letter-spacing:var(--ls-widest);text-transform:uppercase;color:var(--text-subtle)}.chip{border:1px solid var(--border-subtle);border-radius:var(--radius-md);overflow:hidden}.chip .bar{height:44px}.chip .m{padding:6px 8px;font:var(--fw-medium) 10px/1.4 var(--font-mono);color:var(--text-muted)}</style></head><body>
<div class="g" style="grid-template-columns:repeat(4,1fr)">
<div class="chip"><div class="bar" style="background:var(--success)"></div><div style="background:var(--success-bg);padding:9px 10px;font:var(--fw-semibold) 12px/1 var(--font-ui);color:var(--n-800)">Saved</div><div class="m">--success</div></div><div class="chip"><div class="bar" style="background:var(--warning)"></div><div style="background:var(--warning-bg);padding:9px 10px;font:var(--fw-semibold) 12px/1 var(--font-ui);color:var(--n-800)">Trial ending</div><div class="m">--warning</div></div><div class="chip"><div class="bar" style="background:var(--danger)"></div><div style="background:var(--danger-bg);padding:9px 10px;font:var(--fw-semibold) 12px/1 var(--font-ui);color:var(--n-800)">Sync failed</div><div class="m">--danger</div></div><div class="chip"><div class="bar" style="background:var(--info)"></div><div style="background:var(--info-bg);padding:9px 10px;font:var(--fw-semibold) 12px/1 var(--font-ui);color:var(--n-800)">New field type</div><div class="m">--info</div></div>
</div></body></html>
