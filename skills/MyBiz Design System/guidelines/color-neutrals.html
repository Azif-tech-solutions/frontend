<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--surface-page);font:var(--type-body);padding:18px 22px}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)}.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font:var(--fw-semibold) 10px/1 var(--font-mono)}.g{display:grid;gap:12px}.t{font:var(--type-eyebrow);letter-spacing:var(--ls-widest);text-transform:uppercase;color:var(--text-subtle)}.chip{border:1px solid var(--border-subtle);border-radius:var(--radius-md);overflow:hidden}.chip .bar{height:44px}.chip .m{padding:6px 8px;font:var(--fw-medium) 10px/1.4 var(--font-mono);color:var(--text-muted)}</style></head><body>
<div class="sw"><div style="background:var(--n-0);color:var(--n-700)">0</div><div style="background:var(--n-25);color:var(--n-700)">25</div><div style="background:var(--n-50);color:var(--n-700)">50</div><div style="background:var(--n-100);color:var(--n-700)">100</div><div style="background:var(--n-200);color:var(--n-700)">200</div><div style="background:var(--n-300);color:var(--n-700)">300</div><div style="background:var(--n-400);color:var(--n-700)">400</div><div style="background:var(--n-500);color:#fff">500</div><div style="background:var(--n-600);color:#fff">600</div><div style="background:var(--n-700);color:#fff">700</div><div style="background:var(--n-800);color:#fff">800</div><div style="background:var(--n-900);color:#fff">900</div><div style="background:var(--n-950);color:#fff">950</div></div>
<div style="margin-top:12px;font:var(--type-caption);color:var(--text-muted)">Text: 900 strong · 800 body · 500 muted · 400 subtle &nbsp;|&nbsp; Lines: 100 subtle · 200 default · 300 strong</div>
</body></html>
