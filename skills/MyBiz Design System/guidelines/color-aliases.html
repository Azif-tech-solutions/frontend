<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--surface-page);font:var(--type-body);padding:18px 22px}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)}.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font:var(--fw-semibold) 10px/1 var(--font-mono)}.g{display:grid;gap:12px}.t{font:var(--type-eyebrow);letter-spacing:var(--ls-widest);text-transform:uppercase;color:var(--text-subtle)}.chip{border:1px solid var(--border-subtle);border-radius:var(--radius-md);overflow:hidden}.chip .bar{height:44px}.chip .m{padding:6px 8px;font:var(--fw-medium) 10px/1.4 var(--font-mono);color:var(--text-muted)}</style></head><body>
<div style="display:flex;gap:10px">
<div style="flex:1;background:var(--surface-page);border:1px solid var(--border-default);border-radius:var(--radius-card);padding:12px"><div class="t">surface-page</div><div style="font:var(--fw-bold) 15px/1.3 var(--font-ui);color:var(--text-strong);margin-top:8px">text-strong</div><div style="font:var(--type-body);font-size:13px;color:var(--text-body)">text-body</div><div style="font:var(--type-caption);color:var(--text-muted)">text-muted</div></div>
<div style="flex:1;background:var(--surface-sunken);border:1px solid var(--border-default);border-radius:var(--radius-card);padding:12px"><div class="t">surface-sunken</div><div style="font:var(--type-caption);color:var(--text-muted);margin-top:8px">Table headers, toolbars, page wells</div></div>
<div style="flex:1;background:var(--surface-shell);border-radius:var(--radius-card);padding:12px"><div class="t" style="color:rgba(255,255,255,.5)">surface-shell</div><div style="font:var(--fw-semibold) 13px/1.4 var(--font-ui);color:#fff;margin-top:8px">Marketing stats band — burgundy-950 with white-wash hovers</div></div>
<div style="flex:1;background:var(--surface-inverse);border-radius:var(--radius-card);padding:12px"><div class="t" style="color:rgba(255,255,255,.5)">surface-inverse</div><div style="font:var(--fw-semibold) 13px/1.4 var(--font-ui);color:#fff;margin-top:8px">Toasts, tooltips, marketing CTA blocks</div></div>
</div></body></html>
